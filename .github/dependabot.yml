# Weekly PRs to keep Terraform providers and GitHub Actions up to date.
version: 2
updates:
  - package-ecosystem: terraform
    directories:
      - /bootstrap
      - /envs/prod
      - /modules/static_site
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
