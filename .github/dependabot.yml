# Weekly PRs to keep Terraform providers and GitHub Actions up to date.
version: 2
updates:
  - package-ecosystem: terraform
    directories:
      - /bootstrap
      - /envs/prod
      - /modules/static_site
    schedule:
      interval: weekly
    # Wait a few days before proposing a brand-new release, so a compromised
    # or broken publish is usually caught and pulled before it reaches us.
    # Security updates are not delayed.
    cooldown:
      default-days: 5
    groups:
      terraform-providers:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]
